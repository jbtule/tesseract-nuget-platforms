name: Release

# Push a tag "vX.Y.Z" where X.Y.Z matches PACKAGE_VERSION in versions.env
# to build every platform's native libraries and publish the resulting
# NuGet packages to nuget.org via Trusted Publishing (OIDC) -- no API key
# secret needed. Requires:
#   1. A Trusted Publishing policy configured on nuget.org (account ->
#      Trusted Publishing) for this exact repo + workflow file (see
#      https://learn.microsoft.com/nuget/nuget-org/trusted-publishing).
#   2. A NUGET_USER repo secret holding your nuget.org username (profile
#      name, not email) -- not sensitive enough to strictly require a
#      secret, but avoids the username being visible in workflow runs.
#
# The actual packing steps live in pack.yml (shared with ci.yml's
# preview-pack job, so both stay one recipe instead of two that can drift)
# -- this workflow just builds natives, verifies the tag, and calls it with
# publish: true.

on:
  push:
    tags:
      - "v*"

jobs:
  build-native:
    uses: ./.github/workflows/build-native.yml

  build-native-wasm:
    uses: ./.github/workflows/build-native-wasm.yml

  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          pkg_version="$(grep -m1 '^PACKAGE_VERSION=' versions.env | cut -d= -f2)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag v$tag does not match PACKAGE_VERSION=$pkg_version in versions.env" >&2
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

  pack-and-publish:
    needs: [build-native, build-native-wasm, verify-tag]
    uses: ./.github/workflows/pack.yml
    # Both needed: pack.yml's own job requests contents: read (for its
    # checkout step) and id-token: write (Trusted Publishing) -- a reusable
    # workflow's job can't get a permission its caller doesn't also grant.
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.verify-tag.outputs.version }}
      publish: true
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
