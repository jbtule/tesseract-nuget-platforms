name: Build native libraries

# workflow_call/workflow_dispatch only -- ci.yml is the actual pull_request/push
# entry point, calling this plus build-native-wasm.yml plus a preview-pack job. A
# direct pull_request/push trigger here too would double-run this whole 5-RID
# matrix on every relevant change (once from that trigger, once via ci.yml's own
# `uses:` call) -- confirmed as the real reason for removing it, not just tidiness.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # vendor/tesseract, needed to build+smoke-test the wrapper
      - uses: actions/setup-dotnet@v5
        with:
          # 10.0.x too, alongside smoketest.sh's own net8.0 requirement:
          # Tesseract.Tests multi-targets net8/9/10, and running its net10.0
          # target needs the matching runtime actually installed, not just
          # an SDK new enough to compile against it.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf-archive
      - run: bash scripts/build-native.sh linux-x64
      # Uploaded before the smoke test, not after: a smoke test failure
      # shouldn't block being able to pull and inspect the native build
      # that actually succeeded -- this is what let us debug the Windows
      # DLL issues instead of only having log text to go on.
      - uses: actions/upload-artifact@v6
        with:
          name: native-linux-x64
          path: stage/linux-x64
          if-no-files-found: error
      # scripts/run-unit-tests.sh runs via `dotnet run`, not `dotnet test`:
      # see its own comment - neither test project has an MTP/VSTest marker,
      # so `dotnet test` used to silently restore and exit 0 without ever
      # building or running anything.
      - name: Unit tests (against this job's freshly-built, pinned-version native libs)
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/linux-x64/native"
          mkdir -p anyunit-results
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests/Tesseract.Tests.csproj anyunit-results/Tesseract.Tests-linux-x64.json
      - name: SkiaSharp unit tests (Tesseract.CrossPlatform.SkiaSharp)
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/linux-x64/native"
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests.SkiaSharp/Tesseract.Tests.SkiaSharp.csproj anyunit-results/Tesseract.Tests.SkiaSharp-linux-x64.json
      # if: always() - a failed leg's own results.json (with the actual
      # Fail/Error in it) is exactly what anyunit-report's consolidated
      # summary most needs to show, not something to skip on the failure
      # that produced it.
      - name: Upload AnyUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anyunit-results-linux-x64
          path: anyunit-results
          if-no-files-found: warn
      # Only on failure: a golden-fixture mismatch only tells us the two file
      # paths in the console log, not what actually differs -- this is the
      # only way to see the real content without reproducing the exact
      # platform/architecture locally (emulation is not a reliable substitute,
      # confirmed the hard way: an x64-under-QEMU run produced a wall of
      # unrelated engine-init crashes instead of the real signal).
      - name: Upload actual test output (only on failure, for diffing against Results/)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-runs-linux-x64
          path: vendor/tesseract/src/Tesseract.Tests/bin/Release/net10.0/Runs
          if-no-files-found: ignore
      - name: Smoke test (real OCR via the packaged output, no build-only shortcuts)
        run: bash scripts/smoketest.sh linux-x64

  linux-arm64:
    runs-on: ubuntu-22.04-arm # real ARM64 hardware -- no cross-compile needed, unlike win-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          # 10.0.x too, alongside smoketest.sh's own net8.0 requirement:
          # Tesseract.Tests multi-targets net8/9/10, and running its net10.0
          # target needs the matching runtime actually installed, not just
          # an SDK new enough to compile against it.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf-archive
      # vcpkg downloads its own known-good CMake when the system one is too
      # old, but doesn't appear to ship a prebuilt binary for Linux ARM64,
      # silently falling back to Ubuntu 22.04's system cmake (~3.22) -- too
      # old for a `string(JSON ... STRING_ENCODE)` call some port scripts
      # use. Install a current one explicitly rather than relying on that
      # fallback.
      - uses: lukka/get-cmake@latest
      - run: bash scripts/build-native.sh linux-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: native-linux-arm64
          path: stage/linux-arm64
          if-no-files-found: error
      - name: Unit tests (against this job's freshly-built, pinned-version native libs)
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/linux-arm64/native"
          mkdir -p anyunit-results
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests/Tesseract.Tests.csproj anyunit-results/Tesseract.Tests-linux-arm64.json
      - name: SkiaSharp unit tests (Tesseract.CrossPlatform.SkiaSharp)
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/linux-arm64/native"
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests.SkiaSharp/Tesseract.Tests.SkiaSharp.csproj anyunit-results/Tesseract.Tests.SkiaSharp-linux-arm64.json
      - name: Upload AnyUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anyunit-results-linux-arm64
          path: anyunit-results
          if-no-files-found: warn
      - name: Upload actual test output (only on failure, for diffing against Results/)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-runs-linux-arm64
          path: vendor/tesseract/src/Tesseract.Tests/bin/Release/net10.0/Runs
          if-no-files-found: ignore
      - name: Smoke test (real OCR via the packaged output, no build-only shortcuts)
        run: bash scripts/smoketest.sh linux-arm64

  osx-arm64:
    runs-on: macos-14 # Apple Silicon image
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          # 10.0.x too, alongside smoketest.sh's own net8.0 requirement:
          # Tesseract.Tests multi-targets net8/9/10, and running its net10.0
          # target needs the matching runtime actually installed, not just
          # an SDK new enough to compile against it.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: brew install ninja autoconf-archive
      - run: bash scripts/build-native.sh osx-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: native-osx-arm64
          path: stage/osx-arm64
          if-no-files-found: error
      - name: Unit tests (against this job's freshly-built, pinned-version native libs)
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/osx-arm64/native"
          mkdir -p anyunit-results
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests/Tesseract.Tests.csproj anyunit-results/Tesseract.Tests-osx-arm64.json
      - name: SkiaSharp unit tests (Tesseract.CrossPlatform.SkiaSharp)
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/osx-arm64/native"
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests.SkiaSharp/Tesseract.Tests.SkiaSharp.csproj anyunit-results/Tesseract.Tests.SkiaSharp-osx-arm64.json
      - name: Upload AnyUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anyunit-results-osx-arm64
          path: anyunit-results
          if-no-files-found: warn
      - name: Upload actual test output (only on failure, for diffing against Results/)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-runs-osx-arm64
          path: vendor/tesseract/src/Tesseract.Tests/bin/Release/net10.0/Runs
          if-no-files-found: ignore
      - name: Smoke test (real OCR via the packaged output, no build-only shortcuts)
        run: bash scripts/smoketest.sh osx-arm64

  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          # 10.0.x too, alongside smoketest.sh's own net8.0 requirement:
          # Tesseract.Tests multi-targets net8/9/10, and running its net10.0
          # target needs the matching runtime actually installed, not just
          # an SDK new enough to compile against it.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pwsh scripts/build-native.ps1 win-x64
      - uses: actions/upload-artifact@v6
        with:
          name: native-win-x64
          path: stage/win-x64
          if-no-files-found: error
      - name: Unit tests (against this job's freshly-built, pinned-version native libs)
        shell: bash
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/win-x64/native"
          mkdir -p anyunit-results
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests/Tesseract.Tests.csproj anyunit-results/Tesseract.Tests-win-x64.json
      - name: SkiaSharp unit tests (Tesseract.CrossPlatform.SkiaSharp)
        shell: bash
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/win-x64/native"
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests.SkiaSharp/Tesseract.Tests.SkiaSharp.csproj anyunit-results/Tesseract.Tests.SkiaSharp-win-x64.json
      - name: Upload AnyUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anyunit-results-win-x64
          path: anyunit-results
          if-no-files-found: warn
      - name: Upload actual test output (only on failure, for diffing against Results/)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-runs-win-x64
          path: vendor/tesseract/src/Tesseract.Tests/bin/Release/net10.0/Runs
          if-no-files-found: ignore
      - name: Smoke test (real OCR via the packaged output, no build-only shortcuts)
        shell: bash
        run: bash scripts/smoketest.sh win-x64

  # windows-11-arm is real ARM64 hardware with a native ARM64 MSVC toolset
  # (Microsoft.VisualStudio.Component.VC.Tools.ARM64, confirmed via
  # actions/runner-images' own Windows11-Arm64-Readme.md) -- not x64
  # emulation. Builds + smoke-tests in one job, same shape as
  # linux-arm64/osx-arm64: no cross-compile, so no need for a second job on
  # different hardware just to *execute* what got built, unlike the
  # windows-latest-cross-compile approach this replaced.
  win-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          # 10.0.x too, alongside smoketest.sh's own net8.0 requirement:
          # Tesseract.Tests multi-targets net8/9/10, and running its net10.0
          # target needs the matching runtime actually installed, not just
          # an SDK new enough to compile against it.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pwsh scripts/build-native.ps1 win-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: native-win-arm64
          path: stage/win-arm64
          if-no-files-found: error
      - name: Unit tests (against this job's freshly-built, pinned-version native libs)
        shell: bash
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/win-arm64/native"
          mkdir -p anyunit-results
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests/Tesseract.Tests.csproj anyunit-results/Tesseract.Tests-win-arm64.json
      - name: SkiaSharp unit tests (Tesseract.CrossPlatform.SkiaSharp)
        shell: bash
        run: |
          export TESSERACT_NATIVE_DIR="$PWD/stage/win-arm64/native"
          bash scripts/run-unit-tests.sh vendor/tesseract/src/Tesseract.Tests.SkiaSharp/Tesseract.Tests.SkiaSharp.csproj anyunit-results/Tesseract.Tests.SkiaSharp-win-arm64.json
      - name: Upload AnyUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anyunit-results-win-arm64
          path: anyunit-results
          if-no-files-found: warn
      - name: Upload actual test output (only on failure, for diffing against Results/)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-runs-win-arm64
          path: vendor/tesseract/src/Tesseract.Tests/bin/Release/net10.0/Runs
          if-no-files-found: ignore
      - name: Smoke test (real OCR via the packaged output, no build-only shortcuts)
        shell: bash
        run: bash scripts/smoketest.sh win-arm64
