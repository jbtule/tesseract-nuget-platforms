name: CI

# The actual pull_request/push trigger for this repo's native builds --
# build-native.yml and build-native-wasm.yml are workflow_call-only (see their
# own comments) specifically so this is the *one* place that triggers them,
# avoiding a double-run of either. Also packs a preview build of every NuGet
# package (uploaded as a workflow artifact only, never pushed to nuget.org --
# see pack.yml) so a change can be restored/tested from a local feed without
# a real release, which is a real pain to walk back (unlisting a published
# version on nuget.org).

on:
  pull_request:
    paths:
      - "scripts/**"
      - "versions.env"
      - "nuget/**"
      - "smoketest/**"
      - "smoketest-wasm/**"
      - "unittest-wasm-anyunit/**"
      - "vendor/tesseract"
      - ".github/workflows/build-native.yml"
      - ".github/workflows/build-native-wasm.yml"
      - ".github/workflows/pack.yml"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "versions.env"
      - "nuget/**"
      - "smoketest/**"
      - "smoketest-wasm/**"
      - "unittest-wasm-anyunit/**"
      - "vendor/tesseract"
      - ".github/workflows/build-native.yml"
      - ".github/workflows/build-native-wasm.yml"
      - ".github/workflows/pack.yml"
      - ".github/workflows/ci.yml"

jobs:
  build-native:
    uses: ./.github/workflows/build-native.yml

  build-native-wasm:
    uses: ./.github/workflows/build-native-wasm.yml

  # Consolidates every leg's own anyunit-results-* artifact (build-native.yml's
  # 5-RID matrix, plus build-native-wasm.yml's browser-wasm) into one
  # cross-platform view - no single job above can see the full picture on its
  # own, and each leg's own per-RID Platform label (AnyUnit.Util.PlatformId.
  # Current - see Tesseract.Tests's own Program.cs) is exactly what lets
  # anyunit-report merge them into one test x platform matrix instead of
  # colliding/overwriting. if: always() so a legitimately failing leg's own
  # results.json still makes it into the summary - that's exactly the run
  # where a human most wants the consolidated view, not one to skip.
  test-report:
    needs: [build-native, build-native-wasm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install anyunit-report
        run: dotnet tool install --global AnyUnit.Report --version 1.1.0

      # One subdirectory per artifact (the default when merge-multiple isn't
      # set), not a single flattened directory - every leg's own results.json
      # is already uniquely named per-RID (Tesseract.Tests-linux-x64.json,
      # etc.), so this isn't strictly needed to avoid a collision the way
      # AnyUnit's own build.yml comment describes, but it keeps each leg's
      # files easy to tell apart if one ever needs to be inspected directly.
      - name: Download every platform's AnyUnit results
        uses: actions/download-artifact@v6
        with:
          pattern: anyunit-results-*
          path: all-results
          merge-multiple: false

      - name: GitHub-flavored markdown job summary
        if: always()
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          anyunit-report convert -f markdown -o summary.md all-results/*/*.json
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # A test x platform matrix in one self-contained HTML file - anyunit-
      # report's own -f html writer (unlike a plain per-platform TRX/JUnit
      # hand-off, this keeps platform as an axis instead of flattening 5
      # native RIDs + browser-wasm into unrelated-looking "TestName
      # [platform]" rows). Uploaded as an artifact rather than only living in
      # the job summary - the summary's own markdown is deliberately terser.
      - name: Merged HTML test report
        if: always()
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p html-report
          anyunit-report convert -f html -o html-report/report.html all-results/*/*.json

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-html
          path: html-report/report.html
          if-no-files-found: warn

  compute-preview-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: compute
        # PACKAGE_VERSION-preview.<short-sha>: a dot-separated prerelease
        # identifier, not a "+build" metadata suffix -- NuGet/SemVer2 do
        # define build metadata, but it isn't reliably preserved through
        # every NuGet tool/feed in practice, where a plain prerelease label
        # is universally supported and still sorts correctly (before the
        # same revision's stable release).
        run: |
          set -euo pipefail
          pkg_version="$(grep -m1 '^PACKAGE_VERSION=' versions.env | cut -d= -f2)"
          sha="$(git rev-parse --short HEAD)"
          echo "version=${pkg_version}-preview.${sha}" >> "$GITHUB_OUTPUT"

  pack-preview:
    needs: [build-native, build-native-wasm, compute-preview-version]
    uses: ./.github/workflows/pack.yml
    # A reusable workflow's job can't request a permission its caller doesn't
    # also grant -- pack.yml's own job needs both of these (contents: read for
    # its checkout step, id-token: write for Trusted Publishing, unused here
    # since publish: false but still requested). Omitting this entirely is
    # what caused the very first run of this workflow to fail outright at
    # startup (0 jobs scheduled, "workflow file issue"), before any job began.
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.compute-preview-version.outputs.version }}
      publish: false
