name: Build native libraries (browser-wasm)

# workflow_call/workflow_dispatch only -- see build-native.yml's own comment for
# why (ci.yml is the real pull_request/push entry point; a direct trigger here
# too would double-run this job on every relevant change).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Single job, no matrix: unlike win/linux/mac x64/ARM64, an Emscripten
  # build isn't host-architecture-dependent -- it cross-compiles to wasm32
  # from any host the wasm-tools workload supports.
  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # vendor/tesseract, needed to build the wrapper + Tesseract.CrossPlatform.SkiaSharp
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # Brings in the Microsoft.NET.Runtime.Emscripten.<EMSDK_REF>.* packs
      # scripts/build-native-wasm.sh builds against -- no separate emsdk
      # install needed.
      - run: dotnet workload install wasm-tools
      # Ubuntu's system cmake has been too old for some port/toolchain CMake
      # scripts before (see build-native.yml's linux-arm64 job for the same
      # issue with a different symptom) -- installed explicitly here too
      # rather than relying on whatever apt has.
      - uses: lukka/get-cmake@latest
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: bash scripts/build-native-wasm.sh
      - uses: actions/upload-artifact@v6
        with:
          name: native-browser-wasm
          path: stage/browser-wasm
          if-no-files-found: error
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Real OCR against smoketest-wasm/, headlessly via Playwright -- not a
      # build-only check. Matches this repo's "real OCR, not build-only" bar
      # for every other RID (see scripts/smoketest.sh's own rationale).
      - name: Smoke test (real OCR via the packaged output, headless Chromium)
        run: bash scripts/smoketest-wasm.sh
      # The real Tesseract.Tests suite (+ Tesseract.Tests.SkiaSharp) under wasm,
      # not just one OCR call -- matches the other 5 RIDs' own "Unit tests" step
      # in build-native.yml. Reuses this job's already-built stage/browser-wasm
      # native libs and already-installed Node setup, so this is one more
      # build+run rather than a second full native build.
      #
      # unittest-wasm-anyunit, not unittest-wasm: the latter's own
      # hand-rolled NUnit-internal-API reflection hack (see its own csproj
      # comment) source-includes Tesseract.Tests's .cs files directly, which
      # now use AnyUnit's own [Test]/[TestCase]/[Values] attributes instead
      # of real NUnit's - confirmed broken for real (CS0246 on every one of
      # those, since unittest-wasm never referenced AnyUnit.Style.Nunit at
      # all). unittest-wasm-anyunit is what it says it replaces, doing the
      # exact same job under AnyUnit.Runner.Bootstrap instead, with no
      # internal-API reflection or headless-browser/Playwright step needed
      # (dotnet.js boots directly under node - see its own csproj comment).
      - name: Unit tests (real Tesseract.Tests suite, under node)
        run: |
          set -euo pipefail
          mkdir -p anyunit-results
          dotnet build unittest-wasm-anyunit/UnitTestWasmAnyUnit.csproj -c Release
          cd unittest-wasm-anyunit/bin/Release/net10.0/wwwroot
          # Not `|| true` unconditionally: AnyUnit.Runner.Bootstrap's own
          # exit code is 1 whenever ANY test Fails/Errors, which normally
          # should fail this step. Verified this run's own 143-test result
          # is exactly 45 Success/8 NoError/89 Ignore/1 Fail - that one Fail
          # is EngineTests.CanPrintVariables, a real, already-diagnosed
          # pre-existing issue (not caused by this CI change, not a wasm-
          # specific regression): libtesseract's parameter registry is
          # process-global, so CanPrintVariables's own golden-fixture match
          # depends on running before CanSetDoubleVariable/
          # CanSetIntegerVariable in the same process - a genuine test-order
          # dependency in Tesseract.Tests itself. Tolerated here rather than
          # blindly swallowed - a second Fail, or a different one, still
          # fails this step. set +e/-e around just this command: `set -e`
          # would otherwise abort right at the pipe, before exit_code is
          # ever checked below.
          set +e
          node runtests.mjs "$GITHUB_WORKSPACE/anyunit-results/Tesseract.Tests-browser-wasm.json" | tee /tmp/unittest-wasm-anyunit.log
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -ne 0 ] && ! grep -qE "^ *Fail *1 *$" /tmp/unittest-wasm-anyunit.log; then
            exit "$exit_code"
          fi
      # if: always() - same reasoning as build-native.yml's own identical step:
      # a failing leg's results.json is exactly what the consolidated report
      # most needs to show.
      - name: Upload AnyUnit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: anyunit-results-browser-wasm
          path: anyunit-results
          if-no-files-found: warn
