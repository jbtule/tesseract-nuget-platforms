name: Build native libraries (browser-wasm)

# workflow_call/workflow_dispatch only -- see build-native.yml's own comment for
# why (ci.yml is the real pull_request/push entry point; a direct trigger here
# too would double-run this job on every relevant change).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Single job, no matrix: unlike win/linux/mac x64/ARM64, an Emscripten
  # build isn't host-architecture-dependent -- it cross-compiles to wasm32
  # from any host the wasm-tools workload supports.
  browser-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # vendor/tesseract, needed to build the wrapper + Tesseract.CrossPlatform.SkiaSharp
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # Brings in the Microsoft.NET.Runtime.Emscripten.<EMSDK_REF>.* packs
      # scripts/build-native-wasm.sh builds against -- no separate emsdk
      # install needed.
      - run: dotnet workload install wasm-tools
      # Ubuntu's system cmake has been too old for some port/toolchain CMake
      # scripts before (see build-native.yml's linux-arm64 job for the same
      # issue with a different symptom) -- installed explicitly here too
      # rather than relying on whatever apt has.
      - uses: lukka/get-cmake@latest
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: bash scripts/build-native-wasm.sh
      - uses: actions/upload-artifact@v6
        with:
          name: native-browser-wasm
          path: stage/browser-wasm
          if-no-files-found: error
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # Real OCR against smoketest-wasm/, headlessly via Playwright -- not a
      # build-only check. Matches this repo's "real OCR, not build-only" bar
      # for every other RID (see scripts/smoketest.sh's own rationale).
      - name: Smoke test (real OCR via the packaged output, headless Chromium)
        run: bash scripts/smoketest-wasm.sh
      # The real Tesseract.Tests suite (+ Tesseract.Tests.SkiaSharp) under wasm,
      # not just one OCR call -- matches the other 5 RIDs' own "Unit tests" step
      # in build-native.yml. Reuses this job's already-built stage/browser-wasm
      # native libs and already-installed Node setup, so this is one more
      # publish+run rather than a second full native build.
      - name: Unit tests (real Tesseract.Tests suite, headless Chromium)
        run: bash scripts/unittest-wasm.sh
